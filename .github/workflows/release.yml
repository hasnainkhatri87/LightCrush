name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release All OS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Desktop Executables (Multi-OS)
        run: npm run build:desktop
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/lightcrush/lightcrush-win_x64.exe
            dist/lightcrush/lightcrush-mac_universal
            dist/lightcrush/lightcrush-mac_x64
            dist/lightcrush/lightcrush-mac_arm64
            dist/lightcrush/lightcrush-linux_x64
            dist/lightcrush/lightcrush-linux_arm64
            dist/lightcrush/lightcrush-linux_armhf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
